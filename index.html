<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="description" content="Rota 44: streetwear das ruas. Rap, skate e trap em cada peça. Escolha no catálogo e peça pelo WhatsApp.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#070708">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-title" content="Rota 44">

  <!-- Prévia do link no WhatsApp e no Instagram. O WhatsApp exige URL absoluta:
       quando o site tiver endereço definitivo, troque rota44.netlify.app nas duas linhas. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rota 44">
  <meta property="og:title" content="Rota 44 · Streetwear das ruas">
  <meta property="og:description" content="Rap, skate e trap em cada peça. Escolha no catálogo e peça pelo WhatsApp.">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link rel="icon" href="assets/brand/escudo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch.png">
  <link rel="preconnect" href="https://jjynilzpcekissqkbigj.supabase.co" crossorigin>
  <!--
    Os dados do catálogo começam a vir junto com o HTML, sem esperar o JavaScript.
    GET simples, sem cabeçalhos: o navegador não faz a consulta extra (CORS).
    A chave é a "publishable": a mesma do config.js, feita para ser pública.
  -->
  <link rel="preload" as="fetch" crossorigin="anonymous" href="https://jjynilzpcekissqkbigj.supabase.co/rest/v1/rpc/public_catalog?apikey=sb_publishable_VuIb8VQW_25fDUxTk1O81Q_40Cl9ES0">

  <link rel="modulepreload" href="assets/js/config.js">
  <link rel="modulepreload" href="assets/js/core/utils.js">
  <link rel="modulepreload" href="assets/js/core/calc.js">
  <link rel="preload" href="assets/fonts/bebas-neue-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/catalog.css">
